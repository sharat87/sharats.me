version: 3

set:
  - nounset

tasks:
  serve:
    cmds:
      - uv sync
      - bash serve.sh

  build:
    cmds:
      - |
        if [[ -n "${CI-}" ]]; then
          uv sync --no-dev
        else
          uv sync
        fi
      - uv run python build.py

  new:
    preconditions:
      - sh: test -n "{{ .CLI_ARGS }}"
        msg: Please provide a title for the new post
    cmds:
      - |
        f="content/posts/$(date +%Y-%m-%d)-$(
          echo "{{ .CLI_ARGS }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E -e s/\'//g -e 's/[^a-z0-9]+/-/g' -e 's/^-|-$//g'
        ).md"
        if test -f "$f"; then
          echo "File '$f' already exists. Exiting." >&2
          exit 1
        fi
        cat <<EOF > "$f"
        ---
        title: {{ .CLI_ARGS }}
        status: draft
        ---

        Content start here.

        [TOC]

        ## Section 1

        ## Conclusion

        EOF
