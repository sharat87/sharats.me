version: 3

set:
  - nounset

tasks:
  serve:
    cmds:
      - uv sync
      - bash serve.sh

  build:
    cmds:
      - |
        if [[ -n "${CI-}" ]]; then
          uv sync --no-dev
        else
          uv sync
        fi
      - uv run python build.py

  new:
    cmds:
      - |
        title="{{ .CLI_ARGS }}"
        test -n "$title" || title="untitled"
        slug=$(echo "$title" \
          | tr '[:upper:]' '[:lower:]' \
          | sed -E -e s/\'//g -e 's/[^a-z0-9]+/-/g' -e 's/^-|-$//g')
        f="content/posts/$(date +%Y-%m-%d)-${slug}.md"
        if test -f "$f"; then
          echo "File '$f' already exists. Exiting." >&2
          exit 1
        fi
        cat > "$f" <<ENDOFFRONTMATTER
        ---
        title: $title
        status: draft
        ---

        Content start here.

        [TOC]

        ## Section 1

        ## Conclusion

        ENDOFFRONTMATTER
        if [[ "${FROM-}" == "subl" ]]; then
          subl "$f"
        fi
